  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Faros AI Platform
  ServiceCategory: Developer Tools and Engineering Intelligence
  ProviderName: Faros AI
  PublisherName: Faros AI
  InvoiceIssuerName: Faros AI
  BillingCurrency: USD
