meters:
- name: contributor_seats
  description: Active contributors measured by the platform, the primary subscription unit.
  unit: contributors
  aggregation: max
  dimensions:
  - account
  - tier
- name: connectors
  description: SaaS, custom, and hybrid source connectors enabled (limited or unlimited by tier).
  unit: connectors
  aggregation: max
  dimensions:
  - account
  - tier
- name: self_hosted_compute
  description: Infrastructure/compute cost of running Faros Community Edition (customer-incurred).
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - environment
principles:
- name: Visibility
  description: Track contributor counts and enabled connectors against the subscription tier; reconcile annual invoices.
- name: Allocation
  description: Map contributor seats and team usage to internal cost centers and engineering orgs.
- name: Optimization
  description: Right-size the tier (Professional vs Enterprise vs Ultimate) to required connectors, API access, and schema needs; consider Community Edition for self-hosted use cases.
- name: Accountability
  description: Assign an owner for the Faros contract; review seat growth and renewal terms against budget.
