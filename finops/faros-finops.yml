description: >-
  FinOps view of Faros AI spend. Faros is sold as a sales-led SaaS
  subscription across Professional, Enterprise, and Ultimate tiers, generally
  priced per contributor with custom enterprise agreements; an open-source
  Community Edition can be self-hosted at infrastructure cost only. Because
  Faros does not publish committed list prices, the cost figures below are
  not reconciled.
notes: >-
  Subscription amounts are quote-based and not public; verify per-contributor
  pricing and tier inclusions with Faros sales during reconciliation. For the
  Community Edition, costs are the customer's own hosting/compute spend.
sources:
- https://www.faros.ai/pricing
