# Faros AI — representative GraphQL SDL
#
# This is a REPRESENTATIVE schema of the Faros canonical model and its
# Hasura-generated GraphQL query surface, captured for cataloging purposes.
# The live, tenant-specific schema is generated by Hasura against your graph
# (POST https://prod.api.faros.ai/graphs/{graph}/graphql) and is richer:
# every table also gets auto-generated *_aggregate queries, boolean filter
# (_bool_exp), order_by, distinct_on, and insert/update/delete mutations.
# Use GraphiQL against your own graph for the authoritative schema.
#
# Docs: https://docs.faros.ai/docs/querying-data
# OSS:  https://github.com/faros-ai/faros-community-edition

scalar DateTime
scalar timestamptz
scalar uuid
scalar jsonb
scalar numeric

# ---------------------------------------------------------------------------
# Shared / embedded types
# ---------------------------------------------------------------------------

type Category {
  category: String
  detail: String
}

# ---------------------------------------------------------------------------
# Version control (vcs_)
# ---------------------------------------------------------------------------

type vcs_Organization {
  id: ID!
  uid: String!
  name: String
  source: String
  repositories: [vcs_Repository!]!
}

type vcs_Repository {
  id: ID!
  uid: String!
  name: String!
  fullName: String
  private: Boolean
  organization: vcs_Organization
  pullRequests: [vcs_PullRequest!]!
  commits: [vcs_Commit!]!
}

type vcs_User {
  id: ID!
  uid: String!
  name: String
  email: String
  type: Category
  source: String
}

type vcs_Branch {
  id: ID!
  name: String!
  repository: vcs_Repository
}

type vcs_Commit {
  id: ID!
  sha: String!
  message: String
  author: vcs_User
  createdAt: DateTime
  repository: vcs_Repository
}

type vcs_PullRequest {
  id: ID!
  number: Int!
  title: String
  state: Category
  htmlUrl: String
  createdAt: DateTime
  updatedAt: DateTime
  mergedAt: DateTime
  author: vcs_User
  repository: vcs_Repository
  reviews: [vcs_PullRequestReview!]!
  commitCount: Int
  linesAdded: Int
  linesDeleted: Int
}

type vcs_PullRequestReview {
  id: ID!
  number: Int
  state: Category
  submittedAt: DateTime
  reviewer: vcs_User
  pullRequest: vcs_PullRequest
}

# ---------------------------------------------------------------------------
# CI/CD & delivery (cicd_)
# ---------------------------------------------------------------------------

type cicd_Organization {
  id: ID!
  uid: String!
  name: String
  source: String
}

type cicd_Pipeline {
  id: ID!
  uid: String!
  name: String
  organization: cicd_Organization
  builds: [cicd_Build!]!
}

type cicd_Build {
  id: ID!
  uid: String!
  name: String
  number: Int
  status: Category
  startedAt: DateTime
  endedAt: DateTime
  pipeline: cicd_Pipeline
}

type cicd_Artifact {
  id: ID!
  uid: String!
  name: String
  build: cicd_Build
}

type cicd_Deployment {
  id: ID!
  uid: String!
  source: String
  status: Category
  env: Category
  startedAt: DateTime
  endedAt: DateTime
  application: compute_Application
  build: cicd_Build
}

type cicd_Release {
  id: ID!
  uid: String!
  name: String
  releasedAt: DateTime
}

# ---------------------------------------------------------------------------
# Task management (tms_)
# ---------------------------------------------------------------------------

type tms_Project {
  id: ID!
  uid: String!
  name: String!
  source: String
  tasks: [tms_Task!]!
}

type tms_Task {
  id: ID!
  uid: String!
  name: String
  description: String
  type: Category
  status: Category
  priority: Category
  createdAt: DateTime
  updatedAt: DateTime
  resolvedAt: DateTime
  creator: tms_User
  assignee: tms_User
  project: tms_Project
  epic: tms_Epic
  sprint: tms_Sprint
}

type tms_Epic {
  id: ID!
  uid: String!
  name: String
  status: Category
}

type tms_Sprint {
  id: ID!
  uid: String!
  name: String
  state: Category
  startedAt: DateTime
  endedAt: DateTime
}

type tms_User {
  id: ID!
  uid: String!
  name: String
  emailAddress: String
  source: String
}

# ---------------------------------------------------------------------------
# Quality / testing (qa_)
# ---------------------------------------------------------------------------

type qa_TestCase {
  id: ID!
  uid: String!
  name: String
  source: String
}

type qa_TestSuite {
  id: ID!
  uid: String!
  name: String
  source: String
}

type qa_TestExecution {
  id: ID!
  uid: String!
  name: String
  status: Category
  startedAt: DateTime
  endedAt: DateTime
  testCaseResultsStats: jsonb
  build: cicd_Build
}

# ---------------------------------------------------------------------------
# Incident management (ims_)
# ---------------------------------------------------------------------------

type ims_Incident {
  id: ID!
  uid: String!
  title: String
  description: String
  severity: Category
  priority: Category
  status: Category
  source: String
  createdAt: DateTime
  updatedAt: DateTime
  acknowledgedAt: DateTime
  resolvedAt: DateTime
  applicationImpacts: [ims_IncidentApplicationImpact!]!
  events: [ims_IncidentEvent!]!
}

type ims_IncidentEvent {
  id: ID!
  uid: String!
  type: Category
  detail: String
  createdAt: DateTime
  incident: ims_Incident
}

type ims_IncidentApplicationImpact {
  id: ID!
  incident: ims_Incident
  application: compute_Application
}

# ---------------------------------------------------------------------------
# Compute / applications (compute_)
# ---------------------------------------------------------------------------

type compute_Application {
  id: ID!
  name: String!
  platform: String
  deployments: [cicd_Deployment!]!
}

# ---------------------------------------------------------------------------
# Organization (org_)
# ---------------------------------------------------------------------------

type org_Team {
  id: ID!
  uid: String!
  name: String
  description: String
  parentTeam: org_Team
  memberships: [org_TeamMembership!]!
}

type org_Employee {
  id: ID!
  uid: String!
  fullName: String
  email: String
  title: String
}

type org_TeamMembership {
  id: ID!
  team: org_Team
  member: org_Employee
}

# ---------------------------------------------------------------------------
# Platform meta (faros_)
# ---------------------------------------------------------------------------

type faros_Tag {
  id: ID!
  key: String!
  value: String
}

type faros_MetricDefinition {
  id: ID!
  uid: String!
  name: String
  valueType: Category
}

type faros_MetricValue {
  id: ID!
  value: String
  computedAt: DateTime
  definition: faros_MetricDefinition
}

# ---------------------------------------------------------------------------
# Root query (subset — Hasura also generates *_aggregate, *_by_pk, filters)
# ---------------------------------------------------------------------------

type Query {
  vcs_Repository: [vcs_Repository!]!
  vcs_PullRequest: [vcs_PullRequest!]!
  vcs_Commit: [vcs_Commit!]!
  vcs_User: [vcs_User!]!
  cicd_Build: [cicd_Build!]!
  cicd_Deployment: [cicd_Deployment!]!
  cicd_Pipeline: [cicd_Pipeline!]!
  cicd_Artifact: [cicd_Artifact!]!
  tms_Task: [tms_Task!]!
  tms_Project: [tms_Project!]!
  tms_Sprint: [tms_Sprint!]!
  tms_Epic: [tms_Epic!]!
  qa_TestExecution: [qa_TestExecution!]!
  ims_Incident: [ims_Incident!]!
  compute_Application: [compute_Application!]!
  org_Team: [org_Team!]!
  org_Employee: [org_Employee!]!
  faros_MetricValue: [faros_MetricValue!]!
}

# Hasura also generates a Mutation root (insert_*, update_*, delete_*) used
# by faros-js-client's sendMutations / QueryBuilder.upsert for writing data.
